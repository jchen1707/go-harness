name: Generate main
on:
  push:
    branches: [v2]
  pull_request:
permissions:
  contents: read
concurrency:
  group: generate-main-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PR validation must work without a publishing secret.
          token: ${{ github.event_name == 'push' && secrets.WORKFLOW_PAT || github.token }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build generated tree
        run: python3 .agents/transform/generate_main.py . "${RUNNER_TEMP}/main"
      - uses: actions/checkout@v4
        with:
          repository: jchen1707/harness
          ref: main
          path: .harness-check
      - name: Gate generated tree with published plugin
        working-directory: ${{ runner.temp }}/main
        env:
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}/.harness-check/plugins/harness
        run: node scripts/verify.mjs
      - name: Require publishing credential
        if: github.event_name == 'push'
        env:
          PUBLISH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: test -n "$PUBLISH_TOKEN" || { echo 'WORKFLOW_PAT is required to publish main'; exit 1; }
      - name: Publish to main
        if: github.event_name == 'push'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          source_subject="$(git log -1 --format=%s)"

          git fetch origin main
          expected_main="$(git rev-parse origin/main)"
          rm -rf "${RUNNER_TEMP}/publish"
          git worktree add --detach "${RUNNER_TEMP}/publish" origin/main
          cd "${RUNNER_TEMP}/publish"

          # Replace the tree wholesale: a file deleted on `v2` has to disappear here too.
          git rm -rq --ignore-unmatch .
          cp -a "${RUNNER_TEMP}/main/." .
          git add -A

          if git diff --cached --quiet; then
            echo "main is already current"
            exit 0
          fi

          git commit -q \
            -m "build: regenerate main from v2@${source_sha:0:7}" \
            -m "${source_subject}" \
            -m "Generated by .github/workflows/generate-main.yml. Do not edit main by hand — the next push to v2 rebuilds it."
          git push --force-with-lease="refs/heads/main:${expected_main}" origin HEAD:main
